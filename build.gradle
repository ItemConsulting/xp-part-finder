plugins {
  id "maven-publish"
  id "com.enonic.xp.app"
  id "com.github.node-gradle.node" version "7.1.0"
}

dependencies {
  compileOnly xplibs.api.core
  compileOnly xplibs.api.portal

  include xplibs.admin
  include xplibs.auth
  include xplibs.app
  include xplibs.content
  include xplibs.context
  include xplibs.i18n
  include xplibs.node
  include xplibs.project
  include xplibs.schema
  include libs.asset
  include libs.xp.time
  include libs.xp.freemarker
  webjar libs.turbo
}

repositories {
  mavenCentral()
  xp.enonicRepo()
  maven { url = "https://repo.itemtest.no/releases" }
}

node {
  download = true
  // Single source of truth for the Node version, shared with .github/workflows and nvm
  version = file(".nvmrc").text.trim()
}

tasks.withType(Copy).configureEach {
  includeEmptyDirs = false
}

tasks.register("npmCheck", NpmTask) {
  dependsOn npmInstall
  args = [
    "run",
    "check"
  ]
  environment = [
    "FORCE_COLOR": "true",
  ]
}

// If you ALWAYS want to SKIP `test` and `check` tasks on development build, wrap this inside an "if..."
// if (project.findProperty("env") != "dev") {
check.dependsOn npmCheck
// }

tasks.register("npmBuild", NpmTask) {
  args = [
    "run",
    "--silent",
    "build"
  ]
  dependsOn npmInstall
  environment = [
    "FORCE_COLOR": "true",
    "LOG_LEVEL_FROM_GRADLE": gradle.startParameter.logLevel.toString(),
  ]
  inputs.dir "src/main/resources"
  inputs.files "package-lock.json", "tsdown.config.mts", "postcss.config.js", "src/main/resources/tsconfig.json"
  // Only the files that tsdown and postcss write. processResources writes to the same directory, and Gradle never
  // considers a task up to date if another task writes into its outputs.
  outputs.files fileTree("build/resources/main") {
    include "**/*.js"
    include "assets/styles/main.min.css*"
  }
}

jar.dependsOn npmBuild

processResources {
  exclude "**/.gitkeep"
  exclude "**/*.json"
  exclude "**/*.png"
  exclude "**/*.ts"
}

publishing {
  repositories {
    maven {
      name = "itemtestRepository"
      url = "https://repo.itemtest.no/releases"
      credentials(PasswordCredentials)
      authentication {
        basic(BasicAuthentication)
      }
    }
  }
  publications {
    maven(MavenPublication) {
      from components.java
      groupId = group
      artifactId = projectName
      version = project.version
    }
  }
}
