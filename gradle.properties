org.gradle.console=verbose

# Settings for publishing to a Maven repo
group = no.item

# Gradle Project settings
projectName = xp-part-finder
version = 2.0.0

# XP App values (title, description and vendor are in src/main/resources/enonic.yaml)
appName = no.item.partfinder

# Deliberately the XP 8.1 floor, not the newest 8.1.x, so the app installs on any XP 8.1 or newer.
# Raise it only if the app starts needing a later API, and raise the pinned @enonic-types/* versions
# in package.json to match.
xpVersion = 8.1.0

